; shorebridge configuration
; Copy to /etc/shorebridge/config.ini and fill in your PBX details.

[bridge]
; IP the phones and PBX reach this bridge on. "auto" = detect the LAN IP used
; to reach the PBX. Set explicitly if the host is multi-homed.
bind_ip = auto
data_dir = /opt/shorebridge
debug = false
; Web admin UI (add/manage phones by MAC) at http://<bind_ip>:<ui_port>
ui_port = 8910

[pbx]
; Your SIP PBX / SBC connection only. Per-phone extensions + credentials are
; assigned in the web UI and stored in phones.json (/etc/shorebridge/phones.json),
; never here. For 3CX use the SBC address; for FreePBX/Asterisk use the PBX address.
sbc_ip   = 10.0.0.10
sbc_port = 5060
; Registrar domain/realm. For 3CX cloud this is e.g. 1001.3cx.cloud.
; For FreePBX/Asterisk this is usually the PBX IP.
domain   = pbx.example.com
; Local SIP port the bridge uses toward the PBX (UDP). Must be free and differ
; from the PBX port when both run on the same host.
sip_port = 5062
; Send PBX traffic to sbc_ip:sbc_port as an outbound proxy.
;   auto = only when sbc_ip/sbc_port differ from the domain (3CX SBC, cloud PBX)
;   yes  = always      no = never (FreePBX/Asterisk with domain = PBX IP)
outbound_proxy = auto

[phone]
; Timezone string sent to the phones (ShoreTel format).
timezone = Central Standard Time

[connector]
; Optional source of extension data so the UI can offer a dropdown of real
; extensions instead of blank fields (credentials are resolved server-side, never
; sent to the browser). type = manual (default) | 3cx | <your own drop-in>
type = manual
; For type = 3cx (pulls extensions from the 3CX v20 management API, NOT the SBC).
; Create an API client in 3CX: Admin > Integrations > API > "+ Add"
; (Department DEFAULT, Role System Owner). Then:
; api_base      = https://yourpbx.3cx.us   ; your 3CX admin-console URL
; client_id     = shorebridge
; client_secret = <the secret 3CX shows you>
; insecure      = false
